<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded emerald container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Quran / Book Graphic -->
  <g transform="translate(10, 13)">
    <!-- Book Left & Right Pages -->
    <!-- Left Page -->
    <path d="M22 26 C15 23 6 24 2 27 L2 9 C6 6 15 5 22 8 Z" fill="#ffffff" fill-opacity="0.95" stroke="#e2e8f0" stroke-width="0.8"/>
    <!-- Right Page -->
    <path d="M22 26 C29 23 38 24 42 27 L42 9 C38 6 29 5 22 8 Z" fill="#ffffff" fill-opacity="0.95" stroke="#e2e8f0" stroke-width="0.8"/>
    
    <!-- Spine Center -->
    <path d="M22 8 L22 27" stroke="#047857" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Gold Text Lines on Left Page -->
    <line x1="6" y1="11" x2="18" y2="10" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="6" y1="15" x2="18" y2="14" stroke="#059669" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.7"/>
    <line x1="6" y1="19" x2="18" y2="18" stroke="#059669" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.7"/>
    <line x1="8" y1="23" x2="16" y2="22" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Gold Text Lines on Right Page -->
    <line x1="26" y1="10" x2="38" y2="11" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="26" y1="14" x2="38" y2="15" stroke="#059669" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.7"/>
    <line x1="26" y1="18" x2="38" y2="19" stroke="#059669" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.7"/>
    <line x1="28" y1="22" x2="36" y2="23" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Central Ribbon / Bookmark in Gold -->
    <path d="M22 6 L22 23 L24 21 L26 23 L26 6 Z" fill="url(#goldGrad)"/>
    
    <!-- Star above book -->
    <g transform="translate(22, 2) scale(0.65)">
      <polygon points="0,-4 1.2,-1.2 4,0 1.2,1.2 0,4 -1.2,1.2 -4,0 -1.2,-1.2" fill="url(#goldGrad)"/>
    </g>
  </g>
</svg>

